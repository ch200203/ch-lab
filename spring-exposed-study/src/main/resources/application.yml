# db

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

    h2:
      console:
        enabled: true
        path: /h2-console

  exposed:
    generate-ddl: true
    show-sql: true

logging:
  level:
    org.springframework.transaction.interceptor: TRACE
